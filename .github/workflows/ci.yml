name: Code Mode hot source control
on:
  push:
    branches: [ci/checked-construction-766a8ed]
permissions:
  contents: read
jobs:
  source-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: b7a537eb6833ea16960c227d5fc223fcd08ccef6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@v4
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare exact refactor and temporary probe
        env:
          SOURCE_PATCH: 
        run: |
          git show HEAD:src/agents/code-mode-source.ts > src/agents/code-mode-source.baseline.ts
          test "$(git hash-object src/agents/code-mode-source.baseline.ts)" = db7afff36799cbac3a91c661cce3d1d77f7d7524
          printf %s "$SOURCE_PATCH" | base64 --decode > "$RUNNER_TEMP/source.patch"
          git apply --check "$RUNNER_TEMP/source.patch"
          git apply "$RUNNER_TEMP/source.patch"
          test "$(git hash-object src/agents/code-mode-source.ts)" = 7d48ac0cac7574985a55e3209a7bb5638306f7c3
          cat > prepare-source-microprobe.mjs <<'PROBE'
          // Hot default-path control; no engine or owner-path claim.
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { availableParallelism, loadavg } from "node:os";
          import { basename, dirname, resolve } from "node:path";
          import { fileURLToPath, pathToFileURL } from "node:url";
          import { version as acornVersion } from "acorn";
          const self=fileURLToPath(import.meta.url);
          const hash=value=>createHash("sha256").update(value).digest("hex");
          const median=values=>{const s=[...values].sort((a,b)=>a-b),n=s.length;return n%2?s[n>>1]:(s[n/2-1]+s[n/2])/2};
          const p95=values=>[...values].sort((a,b)=>a-b)[Math.ceil(values.length*.95)-1];
          const callsPerBatch=5000,warmupBatches=20,timedBatches=40,code="return 7;";
          if(process.argv[2]==="--child"){
            const modulePath=resolve(process.argv[3]),directory=dirname(modulePath);
            const {prepareSource}=await import(pathToFileURL(modulePath).href);
            const capture=code=>{try{return {ok:true,value:prepareSource(code)}}catch(error){return {ok:false,error}}};
            const identity=()=>Object.fromEntries([modulePath,resolve(directory,"code-mode-script-syntax.ts"),resolve(directory,"tool-input-error.ts"),resolve("pnpm-lock.yaml")].map(path=>[basename(path),hash(readFileSync(path))]));
            const files=identity(),startLoad=loadavg(),wallMs=[],cpuMs=[];
            assert.deepEqual(capture(code),{ok:true,value:code});
            for(let round=-warmupBatches;round<timedBatches;round++){
              const results=new Array(callsPerBatch),cpuStart=process.threadCpuUsage(),started=performance.now();
              for(let i=0;i<callsPerBatch;i++)results[i]=capture(code);
              const elapsed=performance.now()-started,cpu=process.threadCpuUsage(cpuStart);
              for(const result of results)assert.deepEqual(result,{ok:true,value:code});
              if(round>=0){assert(Number.isFinite(elapsed)&&elapsed>0);wallMs.push(elapsed);cpuMs.push((cpu.user+cpu.system)/1000)}
            }
            assert.deepEqual(identity(),files);
            console.log(JSON.stringify({type:"process",node:process.version,arch:process.arch,platform:process.platform,acornVersion,files,benchmarkSha256:hash(readFileSync(self)),availableParallelism:availableParallelism(),startLoad,endLoad:loadavg(),warmupBatches,timedBatches,code,outcome:{ok:true,value:code},rows:[{name:"return7-hot",callsPerBatch,wallMs,cpuMs}],scope:"hot prepareSource control; imports and outcome checks excluded; no forced GC"}));
          }else{
            const [baseline,candidate]=process.argv.slice(2).map(path=>resolve(path));
            assert(baseline&&candidate&&dirname(baseline)===dirname(candidate));
            const records=[];
            for(let pair=1;pair<=5;pair++){
              const order=pair%2?["baseline","candidate"]:["candidate","baseline"];
              for(const [index,arm] of order.entries()){
                const child=spawnSync(process.execPath,[...process.execArgv,self,"--child",arm==="baseline"?baseline:candidate],{encoding:"utf8",timeout:120000,maxBuffer:1024*1024});
                assert.ifError(child.error);assert.equal(child.status,0,child.stderr.slice(-4000));
                const record={...JSON.parse(child.stdout),arm,pair,position:index+1};
                if(records.length)assert.deepEqual(record.outcome,records[0].outcome);
                records.push(record);console.log(JSON.stringify(record));
              }
            }
            const pairedRatios=[],pairedDeltaUs=[],batchP95Ratios=[],cpuRatios=[],baselineUs=[],candidateUs=[];
            for(let pair=1;pair<=5;pair++){
              const [b,c]=["baseline","candidate"].map(arm=>records.find(r=>r.pair===pair&&r.arm===arm).rows[0]);
              const bm=median(b.wallMs),cm=median(c.wallMs);
              pairedRatios.push(cm/bm);pairedDeltaUs.push((cm-bm)*1000/callsPerBatch);
              baselineUs.push(bm*1000/callsPerBatch);candidateUs.push(cm*1000/callsPerBatch);
              batchP95Ratios.push(p95(c.wallMs)/p95(b.wallMs));
              assert(median(b.cpuMs)>0);cpuRatios.push(median(c.cpuMs)/median(b.cpuMs));
            }
            console.log(JSON.stringify({type:"paired-summary",name:"return7-hot",unit:"fresh process pair",pairedMedianRatio:median(pairedRatios),pairedRatios,baselineMedianUsPerCall:median(baselineUs),candidateMedianUsPerCall:median(candidateUs),pairedMedianDeltaUsPerCall:median(pairedDeltaUs),batchP95Ratios,pairedMedianCpuRatio:median(cpuRatios),cpuRatios}));
          }
          PROBE
      - name: Measure fully warmed default source path
        run: |
          node --import ./scripts/tsx.mjs ./prepare-source-microprobe.mjs ./src/agents/code-mode-source.baseline.ts ./src/agents/code-mode-source.ts
