name: Code Mode consumer qualification
on:
  push:
    branches: [ci/consumer-qualification-766a8ed]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 766a8ed10bb0fc5745e354e0bf98db8bf9c2e4b3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@v4
      - name: Compile exact producer source
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:ts
          test "$(git hash-object src/index.ts)" = a77c74543995ea895c6151a359dbed3426763b82
      - uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: b7a537eb6833ea16960c227d5fc223fcd08ccef6
          path: consumer
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: consumer/package.json
      - name: Install frozen consumer and add the boundary regression
        working-directory: consumer
        env:
          TEST_PATCH: 
        run: |
          pnpm install --frozen-lockfile
          printf %s "$TEST_PATCH" | base64 --decode > "$RUNNER_TEMP/catalog.patch"
          git apply --check "$RUNNER_TEMP/catalog.patch"
          git apply "$RUNNER_TEMP/catalog.patch"
          test "$(git hash-object src/agents/code-mode-quickjs.integration.test.ts)" = 32aed6326f16ae2d676c826462bdd36cffc894c1
      - name: Verify original corruption and repaired consumer behavior
        working-directory: consumer
        run: |
          set -euo pipefail
          node -e 'const o=require("node:os");console.log(JSON.stringify({node:process.version,cpus:o.availableParallelism(),memory:o.totalmem(),load:o.loadavg()}))'
          proof_root=$(mktemp -d)
          trap 'rm -rf "$proof_root"' EXIT
          set +e
          node scripts/run-vitest.mjs src/agents/code-mode-quickjs.integration.test.ts -t 'preserves catalog metadata' --maxWorkers=1 --reporter=json --outputFile="$proof_root/baseline.json"
          baseline_status=$?
          set -e
          node --input-type=module - "$proof_root/baseline.json" "$baseline_status" <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const report=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const tests=report.testResults.flatMap(f=>f.assertionResults).filter(t=>t.fullName.includes("preserves catalog metadata"));
          assert.equal(Number(process.argv[3]),1);
          assert.equal(tests.length,3);
          assert.equal(tests.filter(t=>t.status==="passed").length,2);
          const failed=tests.filter(t=>t.status==="failed");
          assert.equal(failed.length,1);
          assert.match(failed[0].fullName,/length=33554432, heap=16/);
          assert.match(failed[0].failureMessages.join("\n"),/completed/);
          console.log("BASELINE_EXPECTED_CORRUPTION",JSON.stringify(tests.map(t=>({name:t.fullName,status:t.status}))));
          NODE
          package_link=extensions/code-mode-quickjs/node_modules/quickjs-wasi
          test -L "$package_link"
          original_package=$(readlink "$package_link")
          cp -R "$(realpath "$package_link")" "$proof_root/package"
          cp ../dist/* "$proof_root/package/dist/"
          unlink "$package_link"
          ln -s "$proof_root/package" "$package_link"
          trap 'unlink "$package_link"; ln -s "$original_package" "$package_link"; rm -rf "$proof_root"' EXIT
          printf 'MATCHED_WASM '; sha256sum "$proof_root/package/quickjs.wasm"
          node scripts/run-vitest.mjs src/agents/code-mode-quickjs.integration.test.ts src/agents/code-mode-engine-parity.test.ts --maxWorkers=1
